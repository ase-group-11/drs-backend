apiVersion: apps/v1
kind: Deployment
metadata:
  name: drs-api
  namespace: drs
spec:
  replicas: 3
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: drs-api
  template:
    metadata:
      labels:
        app: drs-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: drs-api
        image: ghcr.io/ase-group-11/drs-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: drs-secrets
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live   # instant, no I/O
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready  # DB check, but much less frequent
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 600       # was 10 — less DB load
          failureThreshold: 3
          timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drs-consumer
  namespace: drs
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: drs-consumer
  template:
    metadata:
      labels:
        app: drs-consumer
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: drs-consumer
        image: ghcr.io/ase-group-11/drs-backend:latest
        imagePullPolicy: Always
        command: ["python", "-m", "app.consumers.notification_consumer"]
        envFrom:
        - secretRef:
            name: drs-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          exec:
            command:
            - python
            - -c
            # Read the RabbitMQ URL from the env var that already exists in the pod
            # instead of hardcoding amqp://localhost (which was always failing)
            - |
              import os, pika
              url = os.environ.get('RABBITMQ_URL', os.environ.get('AMQP_URL', 'amqp://localhost'))
              conn = pika.BlockingConnection(pika.URLParameters(url))
              conn.close()
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: drs-api
  namespace: drs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: drs-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120  # default 300 — faster recovery after fix
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: drs-consumer
  namespace: drs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: drs-consumer
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120