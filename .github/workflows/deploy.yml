name: Test + Deploy Backend to VM + K3s

on:
  push:
    branches: ["main"]


permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Run tests (no VM needed, runs in CI)
  # ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create minimal .env for tests
        run: |
          cat > .env << 'EOF'
          ENVIRONMENT=testing
          DEBUG=false
          DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL=redis://localhost:6379/1
          JWT_SECRET_KEY=test-secret-key-for-testing-minimum-32-characters-long-required
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          TWILIO_ACCOUNT_SID=test_account_sid
          TWILIO_AUTH_TOKEN=test_auth_token
          TWILIO_PHONE_NUMBER=+1234567890
          OTP_EXPIRY_SECONDS=300
          OTP_LENGTH=6
          TRAFFIC_API_KEY=
          MAPBOX_API_KEY=test_mapbox_key
          EOF

      - name: Run unit tests
        run: |
          pytest app/tests/unit/ \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --html=reports/test-report.html \
            --self-contained-html \
            -v --tb=short
        env:
          ENVIRONMENT: testing

  # ─────────────────────────────────────────────
  # JOB 2: Deploy (only runs if tests pass)
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: test                        # ← blocked until test job is green
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Create .env file on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/drs-app/backend"
          echo "${{ secrets.ENV_FILE }}" | ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cat > ~/drs-app/backend/.env"

      - name: Copy code to VM
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='ase-env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/drs-app/backend/

      - name: Build Docker image on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/drs-app/backend
            docker build -t drs-backend:latest \
              -t ghcr.io/${{ github.repository_owner }}/drs-backend:latest \
              -t ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} .
          "

      - name: Push image to GHCR
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            echo '${{ secrets.GITHUB_TOKEN }}' | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker push ghcr.io/${{ github.repository_owner }}/drs-backend:latest
            docker push ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }}
          "

      - name: Stop old Docker containers on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            docker stop drs-backend 2>/dev/null || true
            docker rm drs-backend 2>/dev/null || true
            docker stop drs-notifications-consumer 2>/dev/null || true
            docker rm drs-notifications-consumer 2>/dev/null || true
          "

      - name: Update K8s secret from .env
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            KUBECONFIG=/home/azureuser/.kube/config kubectl create secret generic drs-secrets \
              --from-env-file=/home/azureuser/drs-app/backend/.env \
              --namespace=drs \
              --dry-run=client -o yaml | \
            KUBECONFIG=/home/azureuser/.kube/config kubectl apply -f -
          "

      - name: Rolling deploy to K3s
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            KUBECONFIG=/home/azureuser/.kube/config kubectl apply -f ~/drs-app/backend/k8s/deployment.yaml

            KUBECONFIG=/home/azureuser/.kube/config kubectl set image deployment/drs-api \
              drs-api=ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} \
              -n drs

            KUBECONFIG=/home/azureuser/.kube/config kubectl set image deployment/drs-consumer \
              drs-consumer=ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} \
              -n drs

            KUBECONFIG=/home/azureuser/.kube/config kubectl set image deployment/drs-celery-worker \
              drs-celery-worker=ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} \
              -n drs

            KUBECONFIG=/home/azureuser/.kube/config kubectl set image deployment/drs-celery-beat \
              drs-celery-beat=ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} \
              -n drs

            echo 'Deploy triggered. Pods updating in background.'
          "

      - name: Verify K3s pods
        run: |
          sleep 30
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "KUBECONFIG=/home/azureuser/.kube/config kubectl get pods -n drs -o wide"
