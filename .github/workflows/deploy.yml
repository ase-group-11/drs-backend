name: Deploy Backend to VM

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Create .env file on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/drs-app/backend"
          echo "${{ secrets.ENV_FILE }}" | ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cat > ~/drs-app/backend/.env"

      - name: Copy code to VM
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='ase-env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/drs-app/backend/

      - name: Build and run Docker container on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/drs-app/backend

            docker stop drs-backend 2>/dev/null || true
            docker rm drs-backend 2>/dev/null || true

            docker build -t drs-backend:latest .

            docker run -d \
              --name drs-backend \
              --restart unless-stopped \
              --env-file .env \
              --network host \
              -p 8000:8000 \
              drs-backend:latest
          "

      - name: Health check
        run: |
          sleep 10
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "curl -f http://localhost:8000/health || (docker logs drs-backend --tail 50 && exit 1)"