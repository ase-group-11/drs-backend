name: Deploy Backend to VM + K3s

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Create .env file on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/drs-app/backend"
          echo "${{ secrets.ENV_FILE }}" | ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cat > ~/drs-app/backend/.env"

      - name: Copy code to VM
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='ase-env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/drs-app/backend/

      - name: Build Docker image on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/drs-app/backend
            docker build -t drs-backend:latest \
              -t ghcr.io/${{ github.repository_owner }}/drs-backend:latest \
              -t ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} .
          "

      - name: Push image to GHCR
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            echo '${{ secrets.GITHUB_TOKEN }}' | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker push ghcr.io/${{ github.repository_owner }}/drs-backend:latest
            docker push ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }}
          "

      - name: Run Docker containers on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            docker stop drs-backend 2>/dev/null || true
            docker rm drs-backend 2>/dev/null || true
            docker stop drs-notifications-consumer 2>/dev/null || true
            docker rm drs-notifications-consumer 2>/dev/null || true

            docker run -d \
              --name drs-backend \
              --restart unless-stopped \
              --env-file ~/drs-app/backend/.env \
              -p 8000:8000 \
              drs-backend:latest

            docker run -d \
              --name drs-notifications-consumer \
              --restart unless-stopped \
              --env-file ~/drs-app/backend/.env \
              drs-backend:latest \
              python -m app.consumers.notification_consumer
          "

      - name: Health check (VM)
        run: |
          sleep 25
          ssh -o StrictHostKeyChecking=no \
              ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
              'docker ps --filter name=drs-backend --filter status=running --format "{{.Names}}: {{.Status}}" | grep drs-backend || (docker logs drs-backend --tail 30 && exit 1)'

      - name: Rolling deploy to K3s
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            kubectl set image deployment/drs-api \
              drs-api=ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} \
              -n drs

            kubectl set image deployment/drs-consumer \
              drs-consumer=ghcr.io/${{ github.repository_owner }}/drs-backend:${{ github.sha }} \
              -n drs

            kubectl rollout status deployment/drs-api -n drs --timeout=120s
            kubectl rollout status deployment/drs-consumer -n drs --timeout=60s
          "

      - name: Verify K3s pods
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "kubectl get pods -n drs -o wide"