version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: drs_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drs_network

  redis:
    image: redis:7-alpine
    container_name: drs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drs_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: drs_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - drs_network

  # Optional: Redis Commander for Redis GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: drs_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - drs_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  drs_network:
    driver: bridge